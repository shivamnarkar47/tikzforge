[package]
name = "tikzforge-core"
version = "0.3.1"
description = "Pure Rust backend logic for TikzForge (compile, engine detection, synctex, persistence helpers)"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }

[lib]
name = "tikzforge_core"
path = "src/lib.rs"