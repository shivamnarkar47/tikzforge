[package]
name = "tikzforge-gpui"
version = "0.2.1"
description = "TikzForge GPUI app"
edition = "2024"

[[bin]]
name = "tikzforge-gpui"
path = "src/main.rs"

[dependencies]
tikzforge-core = { path = "../tikzforge-core" }
gpui = "0.2.2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
