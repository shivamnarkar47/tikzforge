name: CI

on:
  push:
    branches: [gpui-migration, master]
  pull_request:
    branches: [gpui-migration, master]

jobs:
  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libfontconfig1-dev libgraphite2-dev libharfbuzz-dev libicu-dev \
            libpng-dev libssl-dev pkg-config zlib1g-dev patchelf \
            libxkbcommon-dev libwayland-dev libvulkan-dev clang

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build GPUI binary (if present)
        run: |
          if [ -f Cargo.toml ] && grep -q "tikzforge-gpui" Cargo.toml; then
            cargo build -p tikzforge-gpui
          else
            echo "Workspace or tikzforge-gpui crate not present yet; skipping"
          fi

  # Frontend (Tauri/React) tests archived under legacy/; no longer run in CI.