name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libfontconfig1-dev libgraphite2-dev libharfbuzz-dev libicu-dev \
            libpng-dev libssl-dev pkg-config zlib1g-dev patchelf

      - name: Install Tectonic dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or
              -not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
            if (Test-Path $vcpkgRoot) {
              Remove-Item -Recurse -Force $vcpkgRoot
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat')
          }

          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          & $vcpkg install fontconfig freetype 'harfbuzz[graphite2]' icu libpng zlib --triplet x64-windows-static
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          "TECTONIC_DEP_BACKEND=vcpkg" >> $env:GITHUB_ENV
          "RUSTFLAGS=-Ctarget-feature=+crt-static" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache bundled Tectonic engine
        uses: actions/cache@v4
        with:
          path: src-tauri/tectonic
          key: tectonic-${{ matrix.platform }}-${{ hashFiles('scripts/prepare-texlive.sh') }}
          restore-keys: |
            tectonic-${{ matrix.platform }}-

      - name: Prepare bundled Tectonic (Linux)
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 40
        run: bash scripts/prepare-texlive.sh linux

      - name: Prepare bundled Tectonic (Windows)
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 40
        run: bash scripts/prepare-texlive.sh windows

      - name: Generate Tauri config with Tectonic resource
        run: bash scripts/generate-tauri-config.sh --force

      - name: Build
        run: bun run tauri build

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
