name: Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache bundled Tectonic engine
        uses: actions/cache@v4
        with:
          path: src-tauri/tectonic
          key: tectonic-${{ matrix.platform }}-${{ hashFiles('scripts/prepare-texlive.sh') }}
          restore-keys: |
            tectonic-${{ matrix.platform }}-

      - name: Prepare bundled Tectonic (Linux)
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 15
        run: bash scripts/prepare-texlive.sh linux

      - name: Prepare bundled Tectonic (Windows)
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 15
        run: bash scripts/prepare-texlive.sh windows

      - name: Generate Tauri config with Tectonic resource
        run: bash scripts/generate-tauri-config.sh --force

      - name: Build
        run: bun run tauri build

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
