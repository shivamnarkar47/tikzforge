name: Release GPUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gpui:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libgraphite2-dev libharfbuzz-dev libicu-dev \
            libpng-dev libssl-dev pkg-config zlib1g-dev patchelf \
            libxkbcommon-dev libwayland-dev libvulkan-dev clang

      - name: Build GPUI binary
        run: cargo build -p tikzforge-gpui --release

      - name: Upload artifact (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-gpui-linux
          path: target/release/tikzforge-gpui

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-gpui-windows
          path: target/release/tikzforge-gpui.exe

      - name: Create Release (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tikzforge-gpui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Windows asset to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tikzforge-gpui.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}