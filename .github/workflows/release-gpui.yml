name: Release GPUI (draft)

# Disabled by default: manual trigger only until the GPUI binary is ready.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gpui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libfontconfig1-dev libgraphite2-dev libharfbuzz-dev libicu-dev \
            libpng-dev libssl-dev pkg-config zlib1g-dev patchelf \
            libxkbcommon-dev libwayland-dev libvulkan-dev clang

      - name: Build GPUI binary
        run: cargo build -p tikzforge-gpui --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-gpui-linux
          path: target/release/tikzforge-gpui