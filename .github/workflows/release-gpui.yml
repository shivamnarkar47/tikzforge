name: Release GPUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gpui:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libfontconfig1-dev libgraphite2-dev libharfbuzz-dev libicu-dev \
            libpng-dev libssl-dev pkg-config zlib1g-dev patchelf \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev clang

      - name: Build GPUI binary
        run: cargo build -p tikzforge-gpui --release

      - name: Stage icons
        shell: bash
        run: |
          cp legacy/src-tauri/icons/icon.png target/release/tikzforge.png
          cp legacy/src-tauri/icons/icon.ico target/release/tikzforge.ico

      - name: Stage bundled Tectonic (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          bash scripts/prepare-texlive.sh linux
          mkdir -p target/release/tectonic
          cp legacy/src-tauri/tectonic/tectonic target/release/tectonic/tectonic
          chmod +x target/release/tectonic/tectonic

      - name: Stage bundled Tectonic (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          bash scripts/prepare-texlive.sh windows
          mkdir -p target/release/tectonic
          cp legacy/src-tauri/tectonic/tectonic.exe target/release/tectonic/tectonic.exe

      - name: Package (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: tar -czf "tikzforge-gpui-${{ github.ref_name }}-linux-x86_64.tar.gz" -C target/release tikzforge-gpui tectonic tikzforge.png

      - name: Package (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "target/release/tikzforge-gpui.exe", "target/release/tectonic", "target/release/tikzforge.ico" -DestinationPath "tikzforge-gpui-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload artifact (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-gpui-linux
          path: tikzforge-gpui-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tikzforge-gpui-windows
          path: tikzforge-gpui-${{ github.ref_name }}-windows-x86_64.zip

      - name: Create Release (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: tikzforge-gpui-${{ github.ref_name }}-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Windows asset to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: tikzforge-gpui-${{ github.ref_name }}-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}